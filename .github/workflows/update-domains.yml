name: Update accelerated domains

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate optional Loon plugin
        run: python scripts/build_accelerated_plugin.py
      - name: Commit generated plugin
        run: |
          if [[ -n "$(git status --porcelain dist/CN-DNS-Accelerated.plugin)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/CN-DNS-Accelerated.plugin
            git commit -m "chore: update accelerated domains"
            git push
          else
            echo "No changes."
          fi
